<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app/static/app.css">
<link rel="stylesheet" href="/app/static/grok.css">

</head>
<body>

<div class="shell">

    <a class="logo" href="/app" data-link><i aria-hidden="true"></i>TikTok Studio</a>

  <main class="view" id="view"><div class="loading"><span class="spin"></span>Ładowanie...</div></main>

<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
