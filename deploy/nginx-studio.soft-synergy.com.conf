# /etc/nginx/sites-available/studio.soft-synergy.com (symlinked into sites-enabled)
# After the first reload run: certbot --nginx -d studio.soft-synergy.com
server {
  listen 80;
  server_name studio.soft-synergy.com;
  client_max_body_size 2m;

  location / {
    proxy_pass http://127.0.0.1:4318;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;   # AI setup and the streamed agent can take minutes
    proxy_buffering off;       # agent replies stream as server-sent events
  }
}
